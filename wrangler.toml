name = "tlc-chms"
main = "connect-worker.js"
compatibility_date = "2024-01-01"

[vars]
EMAIL_FROM     = "Connect <noreply@notify.timothystl.org>"
REPLY_TO_EMAIL = "dinger@timothystl.org"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Public volunteer/ministry signup site. Renamed 2026-07-20 from volunteer.timothystl.org —
# full cutover (not a redirect): nothing was publicized under the old hostname yet, so the
# route was renamed in place in the Cloudflare dashboard rather than kept as a second route.
# volunteer.timothystl.org no longer resolves at all.
[[routes]]
pattern = "serve.timothystl.org/*"
zone_name = "timothystl.org"
custom_domain = false

# Connect (2026-07-22) — replaces chms.timothystl.org as the single hostname for the
# whole app, staff and members alike (an earlier two-host design, Phase 1, was tried and
# dropped — see CLAUDE.md). This is now the primary Custom Domain.
[[routes]]
pattern = "connect.timothystl.org"
custom_domain = true

# Old hostname, kept resolving to this same Worker purely so connect-worker.js's
# isLegacyChmsHost check can 301-redirect staff's existing bookmarks to
# connect.timothystl.org — not a live app surface anymore.
[[routes]]
pattern = "chms.timothystl.org/*"
zone_name = "timothystl.org"
custom_domain = false

[[d1_databases]]
binding = "DB"
database_name = "tlc-volunteer-db"
database_id = "9399ee53-3386-4084-9b6b-def46b88f96a"
migrations_dir = "migrations"

# Renamed from RSVP_STORE (Cloudflare KV namespace, not the binding name) 2026-09-14: the old
# namespace still exists and is left untouched -- see the data-copy workflow at
# .github/workflows/migrate-rsvp-store-kv.yml and scripts/migrate-kv-namespace.sh for how its
# data (password-reset tokens, member-invite tokens, RSVP/rate-limit counters) was copied here.
# Because the old namespace stayed live and writable throughout the copy, re-run that workflow
# once more immediately before deploying this change to catch up on anything written since the
# last copy, then confirm auth/reset/invite/RSVP flows against the new namespace after deploy,
# before deleting the old RSVP_STORE namespace in a later, separate step.
[[kv_namespaces]]
binding = "RSVP_STORE"
id = "f27b2da9a6ed403da45810617a3e7eb2"

# Renamed from tlc-chms-photos (Cloudflare R2 bucket, not the binding name -- PHOTOS was
# already generic) 2026-09-15: the old bucket still exists and is left untouched -- see the
# data-copy workflow at .github/workflows/migrate-photos-r2.yml and
# scripts/migrate-r2-bucket.sh for how its objects (member/household photos, register scans,
# certificate templates, branding assets) were copied here. Because the old bucket stayed live
# and writable throughout the copy, re-run that workflow once more immediately before deploying
# this change to catch up on anything written since the last copy, then confirm a member/
# household photo actually renders against the new bucket after deploy, before deleting the old
# tlc-chms-photos bucket in a later, separate step.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "timothy-connect-photos"

[triggers]
crons = ["0 14 * * *"]
