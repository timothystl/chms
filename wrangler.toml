# Renamed from tlc-chms 2026-09-15, in place, via the Cloudflare dashboard's Worker Settings ->
# General -> Name field -- unlike KV/R2/D1, Cloudflare Workers now support a true in-place
# rename (same underlying script id, same routes/bindings/cron, confirmed via the dashboard and
# the Workers API before and after). This file must match the live name; a stray deploy.yml
# dispatch against a stale name here would fail (or worse, create a conflicting empty Worker
# under the old name) rather than deploying to the real one. website's CONNECT_WORKER service
# binding and this repo's own wrangler.finance.jsonc CONNECT_SERVICE binding both targeted the
# old name by name (not id) and needed their own matching update -- see those repos/files.
name = "timothy-connect"
main = "connect-worker.js"
compatibility_date = "2024-01-01"

[vars]
FINANCE_STORAGE_MODE = "copying"
EMAIL_FROM     = "Connect <noreply@notify.timothystl.org>"
REPLY_TO_EMAIL = "dinger@timothystl.org"

# Used only to verify the Cf-Access-Jwt-Assertion header Finance's Worker forwards on the
# staff-role-v1 and giving-quick-entry-v1 contract calls -- proves WHO Finance says is acting, not
# whether the call itself is authorized (that's still X-Contract-Key). Neither value is a
# secret: they identify which Cloudflare Access application's public keys to check against,
# not a credential -- see src/access-jwt.js and Zero Trust > Access > Applications >
# "Timothy Finance" > Overview for the source of truth if these ever need to change. Mirrors
# wrangler.staging.toml's own FINANCE_ACCESS_TEAM_DOMAIN/FINANCE_ACCESS_AUD for the staging pair.
FINANCE_ACCESS_TEAM_DOMAIN = "timothystl.cloudflareaccess.com"
FINANCE_ACCESS_AUD         = "74de33dfe1e65b4eea9b8bf51e04d654e470a60773175bf34d74d55e940b66eb"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Public volunteer/ministry signup site. Renamed 2026-07-20 from volunteer.timothystl.org —
# full cutover (not a redirect): nothing was publicized under the old hostname yet, so the
# route was renamed in place in the Cloudflare dashboard rather than kept as a second route.
# volunteer.timothystl.org no longer resolves at all.
[[routes]]
pattern = "serve.timothystl.org/*"
zone_name = "timothystl.org"
custom_domain = false

# Connect (2026-07-22) — replaces chms.timothystl.org as the single hostname for the
# whole app, staff and members alike (an earlier two-host design, Phase 1, was tried and
# dropped — see CLAUDE.md). This is now the primary Custom Domain.
[[routes]]
pattern = "connect.timothystl.org"
custom_domain = true

# Old hostname, kept resolving to this same Worker purely so connect-worker.js's
# isLegacyChmsHost check can 301-redirect staff's existing bookmarks to
# connect.timothystl.org — not a live app surface anymore.
[[routes]]
pattern = "chms.timothystl.org/*"
zone_name = "timothystl.org"
custom_domain = false

# Renamed from tlc-volunteer-db (Cloudflare D1 database, not the binding name -- DB was
# already generic) -- the old database still exists and is left untouched. D1 has no in-place
# rename and no fork/copy-into-new-database capability, so this is a full copy: see the
# data-copy workflow at .github/workflows/migrate-d1-database.yml and
# scripts/migrate-d1-database.sh for how the schema and every row (people, households, giving,
# scheduler/serve, the legacy Finance tables) were copied here, with a from-scratch dry run
# already reconciled clean (schema, row counts, foreign keys, monetary control totals, and
# AUTOINCREMENT sequence state all matched exactly). CRITICAL: this database must never be
# bound to any Worker until after a clean copy run -- see the script's own header for why
# (initDb() would seed it with real hardcoded data using colliding AUTOINCREMENT ids). Because
# the old database stays live and writable right up until this change deploys, re-run that
# workflow once more immediately before deploying this change to catch up on anything written
# since the last copy, then confirm real people/household/giving/scheduler data actually
# renders against the new database after deploy, before deleting the old tlc-volunteer-db
# database in a later, separate step.
[[d1_databases]]
binding = "DB"
database_name = "timothy-connect-db"
database_id = "9e65fb21-5b6c-4f7b-bc0a-8f0ecb38cf05"
migrations_dir = "migrations"

# Namespace renamed from RSVP_STORE (Cloudflare KV namespace, not the binding name) 2026-09-14:
# the old namespace still exists and is left untouched -- see the data-copy workflow at
# .github/workflows/migrate-rsvp-store-kv.yml and scripts/migrate-kv-namespace.sh for how its
# data (password-reset tokens, member-invite tokens, RSVP/rate-limit counters) was copied here.
#
# Binding renamed from RSVP_STORE to KV 2026-09-17: "RSVP_STORE" was misleading as a binding
# name -- this single KV namespace also backs login/password-reset/public-intake/scheduler-signup
# rate limiting, password-reset tokens, member-invite tokens, and QuickBooks OAuth state, not
# just RSVP. Pure code-level identifier rename, no live Cloudflare resource touched or data
# moved -- every env.RSVP_STORE call site across src/*.js, connect-worker.js, and test fixtures
# was updated to env.KV in the same change, matching this repo's existing generic-binding
# convention (DB, PHOTOS).
[[kv_namespaces]]
binding = "KV"
id = "f27b2da9a6ed403da45810617a3e7eb2"

# Renamed from tlc-chms-photos (Cloudflare R2 bucket, not the binding name -- PHOTOS was
# already generic) 2026-09-15: the old bucket still exists and is left untouched -- see the
# data-copy workflow at .github/workflows/migrate-photos-r2.yml and
# scripts/migrate-r2-bucket.sh for how its objects (member/household photos, register scans,
# certificate templates, branding assets) were copied here. Because the old bucket stayed live
# and writable throughout the copy, re-run that workflow once more immediately before deploying
# this change to catch up on anything written since the last copy, then confirm a member/
# household photo actually renders against the new bucket after deploy, before deleting the old
# tlc-chms-photos bucket in a later, separate step.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "timothy-connect-photos"

[triggers]
crons = ["0 14 * * *"]

# Accounting cutover destination; people, Giving, and QuickBooks credentials retain DB.
[[d1_databases]]
binding = "FINANCE_DB"
database_name = "timothy-finance-db"
database_id = "04988828-94b7-43bc-9689-ff570951f1c7"
migrations_dir = "apps/finance/migrations"
