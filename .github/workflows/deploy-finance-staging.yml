name: Deploy Finance Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Finance staging Worker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Finance validation gate
        run: npm run validate:finance

      # Facilities photos/documents bucket (FACILITY_FILES). Created once, the first time a release
      # needs it; an existing bucket and its files are never touched.
      - name: Ensure the Facilities files R2 bucket exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BUCKET: timothy-finance-files-staging
        run: |
          set -euo pipefail
          if npx wrangler r2 bucket info "$BUCKET" >/dev/null 2>&1; then
            echo "R2 bucket $BUCKET already exists."
          else
            npx wrangler r2 bucket create "$BUCKET"
          fi

      - name: Deploy Finance staging (wrangler.finance.staging.jsonc)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config wrangler.finance.staging.jsonc
