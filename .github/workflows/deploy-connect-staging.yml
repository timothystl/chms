name: Deploy Connect Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connect-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Connect staging Worker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify built HTML scripts parse
        run: node .github/scripts/check-built-scripts.js

      - name: Deploy Connect staging (wrangler.staging.toml)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config wrangler.staging.toml
