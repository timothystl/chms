name: Auto-merge Claude branches

# Auto-merges any push to a claude/** branch straight into main (deploy.yml then deploys on
# that push to main) — no PR click required to unblock a merge. See CLAUDE.md for the intended
# workflow this restores; recreated 2026-07-17 after discovering this file had never actually
# been committed to the repo despite CLAUDE.md describing it as live, working infrastructure —
# every prior "auto-merge" was actually a manual merge someone did by hand.
#
# Conflict auto-resolution is DELIBERATELY narrow: only the DEPLOY_VERSION line in
# src/frontend/js-core.js and pure top-of-changelog insertions in NOTES.md/CLAUDE.md are
# auto-resolved (the two hotspots that conflict constantly when multiple claude/** branches land
# around the same time — see NOTES.md's own "don't run two claude/** branches editing shared
# files at once" note). A conflict anywhere else, or a conflict shape in those files that isn't
# recognized, fails the job instead of guessing — a stuck branch needing a manual merge is
# recoverable; a bad auto-resolution silently pushed to production is not.

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-merge-claude
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch pushed branch
        run: git fetch origin "${GITHUB_REF#refs/heads/}"

      - name: Skip if branch has nothing new for main
        id: precheck
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          if git merge-base --is-ancestor "origin/$BRANCH" main; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt merge into main
        id: merge
        if: steps.precheck.outputs.skip == 'false'
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          if git merge --no-ff --no-edit "origin/$BRANCH" -m "Auto-merge $BRANCH into main"; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-resolve known conflict hotspots
        if: steps.precheck.outputs.skip == 'false' && steps.merge.outputs.clean == 'false'
        run: node .github/scripts/resolve-auto-merge-conflicts.js

      - name: Install dependencies
        if: steps.precheck.outputs.skip == 'false'
        run: npm ci

      - name: Run tests
        if: steps.precheck.outputs.skip == 'false'
        run: npm test

      - name: Verify built HTML's script blocks parse
        if: steps.precheck.outputs.skip == 'false'
        run: node .github/scripts/check-built-scripts.js

      - name: Push merge to main
        if: steps.precheck.outputs.skip == 'false'
        run: git push origin HEAD:main
        # Nothing is pushed if any earlier step (conflict resolution, tests, script-parse check)
        # failed — the runner's local checkout is simply discarded, main is never touched.

      - name: Trigger deploy.yml
        if: steps.precheck.outputs.skip == 'false'
        # GitHub does NOT fire other on:push workflows for a push made with the default
        # GITHUB_TOKEN (an anti-recursion safeguard) — deploy.yml's own `on: push: [main]`
        # trigger silently never fires for the push above, so main can accumulate merged
        # commits indefinitely with nothing actually deployed to Cloudflare. Found the hard
        # way: several real commits sat merged-but-undeployed for ~2 hours before this was
        # diagnosed. Explicitly dispatching deploy.yml (which already has workflow_dispatch:
        # as a trigger) works around the restriction — workflow_dispatch fired via the API
        # with GITHUB_TOKEN is allowed, unlike an implicit push-triggered run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
