name = "timothy-connect-staging"
main = "tlc-volunteer-worker.js"
compatibility_date = "2024-01-01"
workers_dev = true

# Renamed from breeze-proxy-worker-staging (2026-09-09): that name dated from when this app began
# as a Breeze ChMS proxy/extension around January 2026; it has served the whole Connect staging
# environment for a while now and the old name no longer matched. Cloudflare Workers cannot be
# renamed in place -- this deploys a NEW Worker under the new name. The old
# breeze-proxy-worker-staging Worker must be deleted separately once this one is confirmed live and
# every reference (this file, docs/OPERATIONS.md, docs/ARCHITECTURE.md, and Finance staging's
# CONNECT_SERVICE binding) has moved to the new name -- an unreferenced leftover Worker isn't
# harmful, just confusing, which is exactly the problem this rename exists to fix.
#
# Deploy:   wrangler deploy --config wrangler.staging.toml
# Secrets:  wrangler secret put <NAME> --config wrangler.staging.toml
# Migrate:  wrangler d1 migrations apply tlc-volunteer-db-staging --remote --config wrangler.staging.toml
# URL:      https://timothy-connect-staging.<subdomain>.workers.dev

[vars]
EMAIL_FROM     = "TLC Gather <noreply@notify.timothystl.org>"
REPLY_TO_EMAIL = "dinger@timothystl.org"

# Used only to verify the Cf-Access-Jwt-Assertion header Finance staging's Worker forwards
# on the giving-quick-entry-v1 contract call -- proves WHO Finance says is acting, not
# whether the call itself is authorized (that's still X-Contract-Key). Neither value is a
# secret: they identify which Cloudflare Access application's public keys to check against,
# not a credential -- see src/access-jwt.js and Zero Trust > Access > Applications >
# "Timothy Finance Staging" > Overview for the source of truth if these ever need to change.
FINANCE_ACCESS_TEAM_DOMAIN = "timothy-digital.cloudflareaccess.com"
FINANCE_ACCESS_AUD         = "bb8fd2d550bee50a2c49c9fa42d212b4f51aff89e2eae17db9c3088b672274de"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[[d1_databases]]
binding = "DB"
database_name = "tlc-volunteer-db-staging"
database_id = "d1d2a73f-67f2-4780-8b96-c97ec6bc2df3"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "RSVP_STORE"
id = "561f364cf1104424bf5f8377ae9d5a32"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "timothy-connect-photos-staging"
jurisdiction = "us"

[triggers]
crons = []
